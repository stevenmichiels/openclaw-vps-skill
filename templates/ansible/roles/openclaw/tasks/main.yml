- name: Install openclaw docker cleanup timer
  template:
    src: openclaw-docker-cleanup.timer.j2
    dest: /etc/systemd/system/openclaw-docker-cleanup.timer
    owner: root
    group: root
    mode: "0644"

- name: Install openclaw-vps release check script
  template:
    src: openclaw-vps-release-check.j2
    dest: /usr/local/sbin/openclaw-vps-release-check
    owner: root
    group: root
    mode: "0750"

- name: Install openclaw-vps release check service
  template:
    src: openclaw-vps-release-check.service.j2
    dest: /etc/systemd/system/openclaw-vps-release-check.service
    owner: root
    group: root
    mode: "0644"

- name: Install openclaw-vps release check timer
  template:
    src: openclaw-vps-release-check.timer.j2
    dest: /etc/systemd/system/openclaw-vps-release-check.timer
    owner: root
