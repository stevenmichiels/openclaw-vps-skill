- name: Install openclaw-vps healthcheck alert script
  template:
    src: openclaw-vps-healthcheck.j2
    dest: /usr/local/sbin/openclaw-vps-healthcheck
    owner: root
    group: root
    mode: "0750"

- name: Install openclaw-vps healthcheck service
  template:
    src: openclaw-vps-healthcheck.service.j2
    dest: /etc/systemd/system/openclaw-vps-healthcheck.service
    owner: root
    group: root
    mode: "0644"

- name: Install openclaw-vps healthcheck timer
  template:
    src: openclaw-vps-healthcheck.timer.j2
    dest: /etc/systemd/system/openclaw-vps-healthcheck.timer
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd for openclaw operational timers
  systemd:
    daemon_reload: true

- name: Ensure openclaw-vps backup timer state
  systemd:
    name: openclaw-vps-backup.timer
    enabled: "{{ openclaw_backup_timer_enabled | default(true) | bool }}"
    state: "{{ (openclaw_backup_timer_enabled | default(true) | bool) | ternary('started', 'stopped') }}"

- name: Ensure openclaw docker cleanup timer state
  systemd:
    name: openclaw-docker-cleanup.timer
    enabled: "{{ openclaw_docker_cleanup_timer_enabled | default(true) | bool }}"
    state: "{{ (openclaw_docker_cleanup_timer_enabled | default(true) | bool) | ternary('started', 'stopped') }}"

- name: Ensure openclaw-vps release check timer state
  systemd:
    name: openclaw-vps-release-check.timer
    enabled: "{{ openclaw_release_check_timer_enabled | default(true) | bool }}"
    state: "{{ (openclaw_release_check_timer_enabled | default(true) | bool) | ternary('started', 'stopped') }}"

- name: Ensure openclaw-vps healthcheck timer state
  systemd:
    name: openclaw-vps-healthcheck.timer
    enabled: "{{ openclaw_healthcheck_timer_enabled | default(true) | bool }}"
    state: "{{ (openclaw_healthcheck_timer_enabled | default(true) | bool) | ternary('started', 'stopped') }}"

- name: Stop openclaw container stack when disabled (container mode)
  command: docker compose -f "{{ openclaw_compose_file_effective }}" down
  failed_when: false
  changed_when: false
  when:
    - openclaw_runtime_mode_effective == 'container'
    - not (openclaw_enable_service | bool)
